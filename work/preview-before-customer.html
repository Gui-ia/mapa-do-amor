function go(n){step=n;render()}
function on(id,event,fn){let el=document.getElementById(id);if(el)el.addEventListener(event,fn)}
function wire(){on('start','click',()=>go(0));on('back','click',()=>go(step-1));on('next','click',()=>{if(step===5)answers.name=document.getElementById('name').value.trim();go(step+1)});document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{let q=D.questions[step];if(q.id==='goal'&&answers.goal!==el.dataset.answer)delete answers.context;answers[q.id]=el.dataset.answer;render()});on('upload','change',e=>{let f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>10*1024*1024){document.getElementById('error').textContent='Bitte JPG, PNG oder WebP bis 10 MB auswählen.';return}let candidate=URL.createObjectURL(f),im=new Image();im.onload=()=>{if(photo)URL.revokeObjectURL(photo);photo=candidate;render()};im.onerror=()=>{URL.revokeObjectURL(candidate);document.getElementById('error').textContent='Dieses Bild konnte nicht geöffnet werden. Bitte wähle ein anderes Foto.'};im.src=candidate});on('analyze','click',()=>go(8));on('offer','click',()=>go(10));on('edit','click',()=>go(0));on('express','change',e=>{express=e.target.checked;document.getElementById('total').textContent=euro(D.price+(express?D.expressFee:0))});on('checkout','click',()=>go(11));on('sample','click',()=>go(12))}
document.getElementById('notesButton').onclick=()=>{let shown=document.body.classList.toggle('show-notes');document.getElementById('notesButton').setAttribute('aria-pressed',String(shown))};document.getElementById('reset').onclick=()=>{clearTimeout(timer);if(photo)URL.revokeObjectURL(photo);photo='';answers={};express=false;go(-1)};render();
</script></html>
